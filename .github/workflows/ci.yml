name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  stdlib:
    name: unit tests (stdlib only, DB tests skip)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -I -m unittest discover -s tests -t . -v

  postgres:
    name: full suite against PostgreSQL 18
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: fineprint
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: fineprint_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fineprint" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Tests drop and rebuild the 'national' schema in this throwaway database only.
      FINEPRINT_DSN: host=127.0.0.1 port=5432 user=fineprint password=ci-only-not-a-secret dbname=fineprint_test
      FINEPRINT_TEST_DB: fineprint_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      # the runner context is not available in job-level env, so FINEPRINT_DATA is set here
      - run: echo "FINEPRINT_DATA=$RUNNER_TEMP/fineprint-data" >> "$GITHUB_ENV"
      - run: python -m pip install "psycopg[binary]==3.3.6"
      - name: full test suite (ingest, crash/resume, graph, CLI, historical rules, privacy guards)
        run: python -I -m unittest discover -s tests -t . -v
      - name: CLI smoke test on the synthetic graph left by the tests
        run: python -I scripts/fp.py --db fineprint_test coverage
